name: GitHub Workflows CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"

      - name: Check GDScript formatting and lint
        run: |
          set -euo pipefail

          mapfile -d '' files < <(find . -name '*.gd' -not -path './.godot/*' -not -path './addons/*' -print0)

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No GDScript files found, skipping."
            exit 0
          fi

          gdformat --check "${files[@]}"
          gdlint "${files[@]}"

  godot-check:
    name: Check Godot project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false

      - name: Import project
        run: godot --headless --import

      - name: Run GUT tests
        if: ${{ hashFiles('addons/gut/**') != '' }}
        run: godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://test -ginclude_subdirs -gexit
